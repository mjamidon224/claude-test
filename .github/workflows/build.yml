name: Build Windows executable

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build NetIPConfig.sln --configuration Release

      - name: Publish single-file executable
        run: >
          dotnet publish src/NetIPConfig/NetIPConfig.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output publish/${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none

      - name: Show what was produced
        shell: pwsh
        run: Get-ChildItem publish/${{ matrix.runtime }} | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NetIPConfig-${{ matrix.runtime }}
          path: publish/${{ matrix.runtime }}/NetIPConfig.exe
          if-no-files-found: error

  release:
    name: Attach executables to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name each executable after its runtime
        run: |
          mkdir -p release
          for directory in artifacts/*/; do
            cp "${directory}NetIPConfig.exe" "release/$(basename "$directory").exe"
          done
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --repo "$GITHUB_REPOSITORY" --generate-notes
